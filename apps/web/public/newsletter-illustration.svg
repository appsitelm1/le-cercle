<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" fill="none">
  <defs>
    <linearGradient id="env" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stopColor="#f43f5e" />
      <stop offset="1" stopColor="#c00b3c" />
    </linearGradient>
    <linearGradient id="bell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stopColor="#fbbf24" />
      <stop offset="1" stopColor="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- fonds doux -->
  <ellipse cx="210" cy="170" rx="170" ry="130" fill="#fde7ee" />
  <ellipse cx="330" cy="150" rx="80" ry="70" fill="#eef2f7" />

  <!-- ombre au sol -->
  <ellipse cx="210" cy="286" rx="140" ry="12" fill="#c00b3c" opacity="0.10" />

  <!-- maison gauche -->
  <g stroke="#c00b3c" strokeWidth="4" strokeLinejoin="round" strokeLinecap="round" fill="none">
    <path d="M78 150 108 126l30 24" />
    <path d="M86 146v34h44v-34" />
    <path d="M98 180v-14h12v14" />
  </g>
  <g stroke="#94a3b8" strokeWidth="3.5" strokeLinecap="round" fill="none">
    <path d="M56 180v-28" />
    <path d="M56 152c-10-6-18-2-18-2M56 152c10-6 18-2 18-2M56 158c-8 0-14-4-14-4M56 158c8 0 14-4 14-4" />
  </g>

  <!-- immeubles droite -->
  <g stroke="#94a3b8" strokeWidth="3.5" strokeLinejoin="round" fill="none">
    <rect x="312" y="168" width="34" height="56" />
    <path d="M312 184h34M312 200h34M312 216h34" />
    <rect x="352" y="192" width="26" height="32" />
    <path d="M352 204h26" />
  </g>

  <!-- épingle de localisation -->
  <g>
    <path d="M338 116c-10 0-18 8-18 17 0 13 18 26 18 26s18-13 18-26c0-9-8-17-18-17Z" fill="#e00b41" />
    <circle cx="338" cy="133" r="6" fill="#fff" />
  </g>

  <!-- enveloppe -->
  <path d="M120 170h180v92h-180z" fill="url(#env)" />
  <path d="M120 178 210 236l90-58" fill="none" stroke="#fff" strokeOpacity="0.55" strokeWidth="3" />

  <!-- carte / maison qui sort de l'enveloppe -->
  <g>
    <rect x="150" y="120" width="120" height="74" rx="4" fill="#fff" />
    <rect x="150" y="120" width="120" height="74" rx="4" stroke="#c00b3c" strokeWidth="3" fill="none" />
    <g stroke="#334155" strokeWidth="2.5" fill="none" strokeLinejoin="round" strokeLinecap="round">
      <path d="M172 166 190 150l18 16" />
      <path d="M177 164v20h26v-20" />
      <path d="M186 184v-10h8v10" />
    </g>
    <path d="M220 156h34M220 166h34M220 176h22" stroke="#cbd5e1" strokeWidth="3" strokeLinecap="round" />
  </g>

  <!-- cloche -->
  <g>
    <path d="M300 74c0-14-11-24-24-24s-24 10-24 24c0 22-10 30-10 30h68s-10-8-10-30Z" fill="url(#bell)" />
    <path d="M268 108a8 8 0 0 0 16 0" fill="none" stroke="#b45309" strokeWidth="3" strokeLinecap="round" />
    <path d="M330 46c8 4 14 12 15 22M326 34c12 4 22 14 26 26" stroke="#fbbf24" strokeWidth="4" strokeLinecap="round" />
  </g>

  <!-- lignes lumineuses -->
  <g stroke="#f43f5e" strokeWidth="4" strokeLinecap="round">
    <path d="M92 96l-14-14M86 112l-20-4M110 86l-4-20" />
  </g>
</svg>
